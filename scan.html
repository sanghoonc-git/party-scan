<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>입장 스캐너</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root {
  --bg:#0f0f1a; --surface:#1a1a2e;
  --accent:#e94560; --success:#00c851;
  --warn:#ffbb33; --danger:#ff4444;
  --text:#f0f0f0; --muted:#888;
}
html,body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:Arial,sans-serif; }

#layout { display:grid; grid-template-rows:auto 1fr auto; height:100dvh; }

header { background:var(--surface); padding:14px 20px; border-bottom:1px solid #222; display:flex; align-items:center; justify-content:space-between; }
header h1 { font-size:1rem; font-weight:700; color:var(--accent); }
.hstats { font-size:0.85rem; color:var(--muted); }
.hstats b { color:var(--text); }

/* 카메라 */
#cameraWrap { position:relative; background:#000; overflow:hidden; }
#video { width:100%; height:100%; object-fit:cover; display:block; }
#canvas { display:none; }

/* 스캔 가이드 오버레이 */
#overlay { position:absolute; inset:0; pointer-events:none; display:flex; align-items:center; justify-content:center; }
.frame { width:240px; height:240px; position:relative; box-shadow:0 0 0 9999px rgba(0,0,0,0.4); border-radius:4px; }
.frame::before { content:''; position:absolute; top:0; left:0; width:40px; height:40px; border-top:4px solid #fff; border-left:4px solid #fff; border-radius:12px 0 0 0; }
.frame::after  { content:''; position:absolute; top:0; right:0; width:40px; height:40px; border-top:4px solid #fff; border-right:4px solid #fff; border-radius:0 12px 0 0; }
.c-bl { position:absolute; bottom:0; left:0; width:40px; height:40px; border-bottom:4px solid #fff; border-left:4px solid #fff; border-radius:0 0 0 12px; }
.c-br { position:absolute; bottom:0; right:0; width:40px; height:40px; border-bottom:4px solid #fff; border-right:4px solid #fff; border-radius:0 0 12px 0; }
.line { position:absolute; left:0; right:0; height:3px; background:linear-gradient(90deg,transparent,var(--accent),transparent); animation:scan 2s ease-in-out infinite; border-radius:2px; }
@keyframes scan { 0%{top:4px;opacity:1} 50%{top:230px;opacity:1} 100%{top:4px;opacity:1} }

/* 결과 팝업 */
#modal { display:none; position:fixed; inset:0; z-index:50; background:rgba(0,0,0,0.75); align-items:center; justify-content:center; }
#modal.show { display:flex; animation:fi .2s; }
@keyframes fi { from{opacity:0} to{opacity:1} }
.card { background:var(--surface); border-radius:24px; padding:36px 32px; text-align:center; width:88%; max-width:360px; border:2px solid transparent; animation:si .2s ease; }
@keyframes si { from{transform:scale(.88);opacity:0} to{transform:scale(1);opacity:1} }
.card.ok   { border-color:var(--success); }
.card.dup  { border-color:var(--warn); }
.card.err  { border-color:var(--danger); }
.micon { font-size:56px; margin-bottom:12px; line-height:1; }
.mname { font-size:26px; font-weight:800; margin-bottom:6px; }
.msub  { font-size:14px; color:var(--muted); margin-bottom:24px; line-height:1.6; white-space:pre-line; }
.card.ok  .mname { color:var(--success); }
.card.dup .mname { color:var(--warn); }
.card.err .mname { color:var(--danger); }
.pbar  { height:6px; background:#333; border-radius:3px; overflow:hidden; }
.pfill { height:100%; border-radius:3px; }
.ok  .pfill { background:var(--success); animation:sh 2.5s linear forwards; }
.dup .pfill { background:var(--warn);    animation:sh 2.5s linear forwards; }
.err .pfill { background:var(--danger);  animation:sh 2.5s linear forwards; }
@keyframes sh { from{width:100%} to{width:0%} }

/* 최근 체크인 */
#recent { background:var(--surface); border-top:1px solid #222; padding:12px 16px; max-height:160px; overflow-y:auto; }
.rtitle { font-size:0.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
.ritem  { display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid rgba(255,255,255,0.05); font-size:0.88rem; }
.ritem:last-child { border-bottom:none; }
.rn { font-weight:600; }
.rt { font-size:0.75rem; color:var(--muted); }

/* 설정 화면 */
#cfg { position:fixed; inset:0; z-index:200; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px; gap:16px; }
#cfg h2 { color:var(--accent); font-size:1.2rem; }
#cfg p  { color:var(--muted); font-size:13px; text-align:center; line-height:1.7; }
#cfg input  { width:100%; max-width:480px; padding:12px 16px; background:#1a1a2e; border:1px solid #333; border-radius:10px; color:var(--text); font-size:0.85rem; }
#cfg button { padding:12px 32px; background:var(--accent); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:700; cursor:pointer; }

/* 로딩 */
#loading { position:fixed; inset:0; z-index:100; background:var(--bg); display:none; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
.spin { width:40px; height:40px; border:3px solid #333; border-top-color:var(--accent); border-radius:50%; animation:sp .8s linear infinite; }
@keyframes sp { to{transform:rotate(360deg)} }
</style>
</head>
<body>

<div id="cfg">
  <h2>스캐너 초기 설정</h2>
  <p>Apps Script 웹 앱 URL을 입력해 주세요.<br>한 번만 입력하면 저장됩니다.</p>
  <input type="url" id="urlInput" placeholder="https://script.google.com/macros/s/.../exec">
  <button onclick="saveConfig()">저장 후 시작</button>
</div>

<div id="loading">
  <div class="spin"></div>
  <p id="loadMsg">카메라 시작 중...</p>
</div>

<div id="layout" style="display:none">
  <header>
    <h1>입장 스캐너</h1>
    <div class="hstats">체크인 <b id="sIn">0</b>명</div>
  </header>
  <div id="cameraWrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="overlay">
      <div class="frame">
        <div class="c-bl"></div>
        <div class="c-br"></div>
        <div class="line"></div>
      </div>
    </div>
  </div>
  <div id="recent">
    <div class="rtitle">최근 체크인</div>
    <div id="recentList"><div style="color:var(--muted);font-size:13px;padding:6px 0">스캔을 시작하면 기록됩니다</div></div>
  </div>
</div>

<div id="modal">
  <div class="card" id="card">
    <div class="micon" id="micon"></div>
    <div class="mname" id="mname"></div>
    <div class="msub"  id="msub"></div>
    <div class="pbar"><div class="pfill" id="pfill"></div></div>
  </div>
</div>

<script>
const LS_KEY = 'party_script_url_v2';
let isProcessing = false;
let scanLoop = null;
let countIn = 0;
const recentList = [];

// ── 설정 ─────────────────────────────────────────────
function saveConfig() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url.includes('script.google.com')) { alert('올바른 Apps Script URL을 입력해 주세요.'); return; }
  localStorage.setItem(LS_KEY, url);
  document.getElementById('cfg').style.display = 'none';
  startCamera();
}
function getUrl() { return localStorage.getItem(LS_KEY) || ''; }

// ── 카메라 시작 ───────────────────────────────────────
async function startCamera() {
  document.getElementById('loading').style.display = 'flex';

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width:  { ideal: 1920 },
        height: { ideal: 1080 },
      },
      audio: false
    });

    const video = document.getElementById('video');
    video.srcObject = stream;
    await new Promise(r => video.onloadedmetadata = r);
    await video.play();

    document.getElementById('loading').style.display = 'none';
    document.getElementById('layout').style.display  = 'grid';

    startScanLoop();
  } catch(e) {
    document.getElementById('loadMsg').textContent = '카메라 권한을 허용해 주세요: ' + e.message;
  }
}

// ── 스캔 루프 (jsQR) ──────────────────────────────────
function startScanLoop() {
  const video  = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx    = canvas.getContext('2d', { willReadFrequently: true });

  function tick() {
    scanLoop = requestAnimationFrame(tick);
    if (isProcessing) return;
    if (video.readyState < 2) return;

    const w = video.videoWidth;
    const h = video.videoHeight;
    if (!w || !h) return;

    canvas.width  = w;
    canvas.height = h;
    ctx.drawImage(video, 0, 0, w, h);

    const imageData = ctx.getImageData(0, 0, w, h);
    const code = jsQR(imageData.data, w, h, { inversionAttempts: 'dontInvert' });

    if (code && code.data) {
      handleScan(code.data);
    }
  }
  tick();
}

// ── 스캔 처리 ─────────────────────────────────────────
async function handleScan(text) {
  if (isProcessing) return;

  let token = text.trim();
  try {
    const u = new URL(text);
    const t = u.searchParams.get('token');
    if (t) token = t;
  } catch {}
  if (!token) return;

  isProcessing = true;
  if (navigator.vibrate) navigator.vibrate(40);

  try {
    const apiUrl = getUrl() + '?token=' + encodeURIComponent(token) + '&fmt=json';
    const res    = await fetch(apiUrl, { redirect: 'follow' });
    const result = await res.json();
    showResult(result);
  } catch(e) {
    showResult({ ok: false, error: '서버 오류\n' + e.message });
  }
}

// ── 결과 팝업 ─────────────────────────────────────────
function showResult(r) {
  const modal = document.getElementById('modal');
  const card  = document.getElementById('card');
  card.className = 'card';

  if (r.ok) {
    card.classList.add('ok');
    document.getElementById('micon').textContent = '✓';
    document.getElementById('mname').textContent = r.name;
    document.getElementById('msub' ).textContent = '입장이 확인되었습니다!';
    countIn++;
    document.getElementById('sIn').textContent = countIn;
    addRecent(r.name);
    if (navigator.vibrate) navigator.vibrate([40, 20, 40]);
  } else if (r.alreadyCheckedIn) {
    card.classList.add('dup');
    document.getElementById('micon').textContent = '!';
    document.getElementById('mname').textContent = r.name;
    document.getElementById('msub' ).textContent = '이미 입장 처리된 분입니다\n(' + (r.checkedInAt || '') + ')';
    if (navigator.vibrate) navigator.vibrate([100, 40, 100]);
  } else {
    card.classList.add('err');
    document.getElementById('micon').textContent = '✕';
    document.getElementById('mname').textContent = '확인 불가';
    document.getElementById('msub' ).textContent = r.error || '등록되지 않은 QR입니다';
    if (navigator.vibrate) navigator.vibrate(200);
  }

  modal.classList.add('show');
  const pf = document.getElementById('pfill');
  pf.style.animation = 'none';
  void pf.offsetHeight;
  pf.style.animation = 'sh 2.5s linear forwards';

  setTimeout(() => { modal.classList.remove('show'); isProcessing = false; }, 2500);
}

// ── 최근 목록 ─────────────────────────────────────────
function addRecent(name) {
  const t = new Date().toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  recentList.unshift({ name, t });
  if (recentList.length > 15) recentList.pop();
  document.getElementById('recentList').innerHTML = recentList
    .map(r => `<div class="ritem"><span class="rn">✓ ${r.name}</span><span class="rt">${r.t}</span></div>`)
    .join('');
}

document.getElementById('modal').addEventListener('click', function() {
  this.classList.remove('show');
  isProcessing = false;
});

// ── 시작 ─────────────────────────────────────────────
window.addEventListener('load', () => {
  if (getUrl()) {
    document.getElementById('cfg').style.display = 'none';
    startCamera();
  }
});
</script>
</body>
</html>
