<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>입장 스캐너</title>
<style>
  :root{
    --bg:#0a0c10; --ink:#f4f6fb; --muted:#8a93a6;
    --ok:#1fbf6b; --guest:#3b82f6; --dup:#f5a623; --err:#ff4d4f; --line:#1c2430;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Segoe UI",sans-serif;
    overflow:hidden; user-select:none; -webkit-user-select:none;}
  #app{position:fixed; inset:0; display:flex; flex-direction:column;}

  /* ── 카메라 영역 ── */
  #stage{position:relative; flex:1; overflow:hidden; background:#000;}
  #video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}

  /* 스캔 가이드 박스 */
  #reticle{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:min(62vw,360px); aspect-ratio:1; pointer-events:none; z-index:3;}
  #reticle::before{content:""; position:absolute; inset:0; border-radius:28px;
    box-shadow:0 0 0 9999px rgba(0,0,0,.42);}
  .corner{position:absolute; width:38px; height:38px; border:4px solid #fff; opacity:.92;}
  .corner.tl{top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:18px;}
  .corner.tr{top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:18px;}
  .corner.bl{bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:18px;}
  .corner.br{bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:18px;}
  #scanline{position:absolute; left:8%; right:8%; height:3px; border-radius:3px;
    background:linear-gradient(90deg,transparent,#fff,transparent);
    animation:sweep 2.1s ease-in-out infinite; opacity:.85;}
  @keyframes sweep{0%,100%{top:10%}50%{top:90%}}
  @media (prefers-reduced-motion:reduce){#scanline{animation:none; top:50%;}}

  /* ── 풀스크린 결과 플래시 ── */
  #flash{position:absolute; inset:0; z-index:6; display:flex; align-items:center;
    justify-content:center; flex-direction:column; gap:10px; text-align:center;
    opacity:0; pointer-events:none; transition:opacity .12s; padding:24px;}
  #flash.show{opacity:1;}
  #flash.emp{background:rgba(31,191,107,.95);}
  #flash.guest{background:rgba(59,130,246,.95);}
  #flash.dup{background:rgba(245,166,35,.94);}
  #flash.err{background:rgba(255,77,79,.94);}
  #flashIcon{font-size:84px; line-height:1; font-weight:800;}
  #flashName{font-size:40px; font-weight:800; letter-spacing:-.02em; word-break:keep-all;}
  #flashBadge{font-size:26px; font-weight:800; letter-spacing:-.01em; word-break:keep-all;
    padding:10px 26px; border-radius:999px; background:rgba(0,0,0,.20);
    border:2px solid rgba(255,255,255,.55);}
  #flashBadge:empty{display:none;}
  #flashMsg{font-size:20px; font-weight:600; opacity:.92;}

  /* ── 하단 상태바 ── */
  #bar{flex:0 0 auto; padding:16px 20px calc(16px + env(safe-area-inset-bottom));
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    border-top:1px solid var(--line); background:#0c0f15;}
  #counts{display:flex; align-items:center; gap:18px;}
  .countBox{display:flex; align-items:baseline; gap:7px;}
  .countBox .n{font-size:34px; font-weight:800; letter-spacing:-.03em; font-variant-numeric:tabular-nums;}
  .countBox .lbl{font-size:13px; color:var(--muted); font-weight:600;}
  #ticketN{color:var(--guest);}
  #engine{font-size:11px; color:var(--muted); font-weight:600; padding:5px 9px;
    border:1px solid var(--line); border-radius:999px; white-space:nowrap;}
  #status{font-size:13px; color:var(--muted); font-weight:600;}
  .dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px;
    background:var(--err); vertical-align:middle;}
  .dot.live{background:var(--ok); box-shadow:0 0 8px var(--ok);}

  /* ── 시작/오류 오버레이 ── */
  #gate{position:absolute; inset:0; z-index:9; background:var(--bg);
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    gap:20px; padding:32px; text-align:center;}
  #gate h1{font-size:24px; font-weight:800; letter-spacing:-.02em;}
  #gate p{font-size:15px; color:var(--muted); max-width:340px; line-height:1.5;}
  #startBtn{font:inherit; font-size:18px; font-weight:700; color:#0a0c10;
    background:#fff; border:0; border-radius:14px; padding:16px 40px; cursor:pointer;}
  #startBtn:active{transform:scale(.97);}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <video id="video" playsinline autoplay muted></video>

    <div id="reticle">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
      <div id="scanline"></div>
    </div>

    <div id="flash">
      <div id="flashIcon"></div>
      <div id="flashName"></div>
      <div id="flashBadge"></div>
      <div id="flashMsg"></div>
    </div>

    <div id="gate">
      <h1>입장 스캐너</h1>
      <p>아래 버튼을 누르고 카메라 권한을 허용하세요. QR을 가이드 박스 안에 맞추면 자동으로 인식됩니다.</p>
      <button id="startBtn">스캔 시작</button>
    </div>
  </div>

  <div id="bar">
    <div id="counts">
      <div class="countBox">
        <span class="n" id="countN">0</span>
        <span class="lbl">입장</span>
      </div>
      <div class="countBox">
        <span class="n" id="ticketN">0</span>
        <span class="lbl">🎫 응모권</span>
      </div>
    </div>
    <div id="status"><span class="dot" id="liveDot"></span><span id="statusTxt">대기 중</span></div>
    <span id="engine">엔진 확인 중</span>
  </div>
</div>

<!-- jsQR fallback (BarcodeDetector 미지원 기기 전용) -->
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
(function(){
  "use strict";

  // ── 설정 ──
  // GAS 웹앱 배포 URL (.../exec 로 끝나는 주소)
  // Apps Script 편집기 > 배포 > 배포 관리 에서 복사
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbwHoTTtLLGpD60b7UDceAiJ0Q7aakUywRgIh0mRP8z3eY9BcckLDCnQoh1T34SazKCXiA/exec';

  // ── DOM ──
  const video   = document.getElementById('video');
  const flash   = document.getElementById('flash');
  const fIcon   = document.getElementById('flashIcon');
  const fName   = document.getElementById('flashName');
  const fBadge  = document.getElementById('flashBadge');
  const fMsg    = document.getElementById('flashMsg');
  const gate    = document.getElementById('gate');
  const startBtn= document.getElementById('startBtn');
  const countN  = document.getElementById('countN');
  const ticketN = document.getElementById('ticketN');
  const engineEl= document.getElementById('engine');
  const statusTxt = document.getElementById('statusTxt');
  const liveDot = document.getElementById('liveDot');

  // ── 상태 ──
  let detector = null;          // BarcodeDetector 인스턴스 (있으면)
  let useNative = false;
  let stream = null;
  let scanning = false;
  let inflight = false;         // 서버 호출 진행 중 여부
  let sessionCount = 0;
  let sessionTickets = 0;       // 응모권 지급 대상(직원) 입장 수
  let lastToken = '';           // 직전 인식 토큰
  let lastTokenAt = 0;          // 직전 인식 시각
  const DUP_WINDOW = 3000;      // 같은 토큰 무시 시간(ms)

  // jsQR용 canvas
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  // ── 사운드 (Web Audio) ──
  let actx = null;
  function beep(type){
    try{
      if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
      const seq = type==='emp'   ? [[660,0,.08],[880,.09,.13]]   // 상승 2음 = 티켓 지급
                : type==='guest' ? [[523,0,.13]]                  // 단음 = 입장만
                : type==='dup'   ? [[660,0,.09],[660,.13,.09]]    // 동일음 2회 = 중복
                : /* err */        [[180,0,.30]];                 // 저음 부저 = 오류/미등록
      seq.forEach(([f,t,d])=>{
        const o=actx.createOscillator(), g=actx.createGain();
        o.type='square'; o.frequency.value=f;
        o.connect(g); g.connect(actx.destination);
        const s=actx.currentTime+t;
        g.gain.setValueAtTime(.0001,s);
        g.gain.exponentialRampToValueAtTime(.25,s+.01);
        g.gain.exponentialRampToValueAtTime(.0001,s+d);
        o.start(s); o.stop(s+d+.02);
      });
    }catch(e){}
  }
  function buzz(ms){ if(navigator.vibrate) navigator.vibrate(ms); }

  // ── 카메라 시작 ──
  async function start(){
    if(GAS_URL.indexOf('여기에') !== -1){
      gateError('GAS_URL이 설정되지 않았어요. scan.html 상단의 GAS_URL을 배포된 웹앱 주소로 바꿔주세요.');
      return;
    }
    gate.querySelector('p').textContent = '카메라 여는 중…';
    startBtn.disabled = true;

    // BarcodeDetector 지원 확인
    try{
      if('BarcodeDetector' in window){
        const fmts = await window.BarcodeDetector.getSupportedFormats();
        if(fmts.includes('qr_code')){
          detector = new window.BarcodeDetector({ formats:['qr_code'] });
          useNative = true;
        }
      }
    }catch(e){ useNative = false; }
    engineEl.textContent = useNative ? '네이티브 ⚡' : 'jsQR';

    // 후면 카메라 + 적정 해상도
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        audio:false,
        video:{
          facingMode:{ ideal:'environment' },
          width:{ ideal:1280 }, height:{ ideal:720 }
        }
      });
    }catch(err){
      gateError('카메라를 열 수 없습니다. 권한을 허용했는지, 다른 앱이 카메라를 쓰고 있지 않은지 확인하세요.');
      return;
    }

    video.srcObject = stream;
    await video.play().catch(()=>{});

    // 줌 1.0 고정 + 연속 포커스
    await lockCamera();

    gate.classList.add('hidden');
    liveDot.classList.add('live');
    statusTxt.textContent = '스캔 중';
    scanning = true;
    loop();
  }

  // 땡겨진 줌/포커스 잡기
  async function lockCamera(){
    try{
      const track = stream.getVideoTracks()[0];
      if(!track || !track.getCapabilities) return;
      const caps = track.getCapabilities();
      const adv = [];
      if(caps.zoom)        adv.push({ zoom: caps.zoom.min || 1 });
      if(caps.focusMode && caps.focusMode.includes('continuous'))
        adv.push({ focusMode:'continuous' });
      if(adv.length) await track.applyConstraints({ advanced: adv });
    }catch(e){ /* 일부 기기는 미지원 — 무시 */ }
  }

  // ── 스캔 루프 ──
  async function loop(){
    if(!scanning){ return; }
    let raw = null;
    try{
      if(useNative){
        const codes = await detector.detect(video);
        if(codes && codes.length) raw = codes[0].rawValue;
      }else{
        raw = decodeJsQR();
      }
    }catch(e){ /* 프레임 스킵 */ }

    if(raw) handleCode(raw.trim());
    requestAnimationFrame(loop);
  }

  function decodeJsQR(){
    const w = video.videoWidth, h = video.videoHeight;
    if(!w || !h) return null;
    // 중앙 정사각 영역만 잘라서 디코딩 → 빠르고 정확
    const side = Math.min(w,h);
    const sx = (w-side)/2, sy = (h-side)/2;
    const size = 480; // 다운스케일
    canvas.width = size; canvas.height = size;
    ctx.drawImage(video, sx, sy, side, side, 0, 0, size, size);
    const img = ctx.getImageData(0,0,size,size);
    const code = window.jsQR(img.data, size, size, { inversionAttempts:'dontInvert' });
    return code ? code.data : null;
  }

  // ── 코드 처리 ──
  function handleCode(token){
    const now = Date.now();
    if(!token) return;
    // 같은 토큰 연속 무시
    if(token === lastToken && now - lastTokenAt < DUP_WINDOW) return;
    // 서버 호출이 밀려있으면 새 호출 막되, 다른 토큰이면 통과
    if(inflight && token === lastToken) return;

    lastToken = token; lastTokenAt = now;
    inflight = true;

    // GAS 백엔드 호출 (GitHub Pages → GAS 웹앱 GET 요청)
    const url = GAS_URL + '?action=checkin&token=' + encodeURIComponent(token);
    fetch(url)
      .then(r => r.json())
      .then(onResult)
      .catch(onFail);
  }

  function onResult(res){
    inflight = false;
    res = res || {};
    // status: 'ok'(정상) | 'already'(중복) | 'notfound'(미등록)
    // type:   'employee'(직원·응모권 대상) | 'guest'(게스트·응모권 없음)
    const st = res.status || (res.ok ? 'ok' : 'notfound');
    const isEmp = res.type === 'employee';

    if(st === 'ok'){
      sessionCount++;
      countN.textContent = sessionCount;
      if(isEmp){
        sessionTickets++;
        ticketN.textContent = sessionTickets;
        showFlash('emp','✓', res.name || '입장 완료', '🎫 응모권 지급', '직원');
        beep('emp'); buzz(60);
      }else{
        showFlash('guest','✓', res.name || '입장 완료', '응모권 없음', '게스트');
        beep('guest'); buzz(60);
      }
    }else if(st === 'already'){
      const who = isEmp ? '직원 · 이미 지급됨' : '게스트 · 응모권 대상 아님';
      showFlash('dup','!', res.name || '이미 입장', '이미 체크인됨' + (res.checkedAt? ' · '+res.checkedAt : ''), who);
      beep('dup'); buzz([40,40,40]);
    }else{
      showFlash('err','✕', '미등록 QR', '명단에 없는 코드입니다', '');
      beep('err'); buzz(200);
    }
  }

  function onFail(err){
    inflight = false;
    showFlash('err','✕', '오류', '', '네트워크 확인 후 다시 스캔');
    beep('err'); buzz(200);
  }

  // ── 결과 플래시 ──
  // badge: 큰 알약형 안내(응모권 지급 여부 등, 핵심 정보)
  // msg:   작은 보조 텍스트
  let flashTimer = null;
  function showFlash(kind, icon, name, badge, msg){
    flash.className = 'show ' + kind;
    fIcon.textContent  = icon;
    fName.textContent  = name;
    fBadge.textContent = badge || '';
    fMsg.textContent   = msg || '';
    clearTimeout(flashTimer);
    const dur = (kind==='emp' || kind==='guest') ? 1100 : 1500; // 정상은 빠르게, 나머진 좀 더 길게
    flashTimer = setTimeout(()=>{ flash.className=''; }, dur);
  }

  function gateError(msg){
    gate.classList.remove('hidden');
    gate.querySelector('h1').textContent = '카메라 오류';
    gate.querySelector('p').textContent = msg;
    startBtn.disabled = false;
    startBtn.textContent = '다시 시도';
  }

  // 백그라운드 복귀 시 카메라 재정렬
  document.addEventListener('visibilitychange', ()=>{
    if(!document.hidden && stream) lockCamera();
  });

  startBtn.addEventListener('click', start);
})();
</script>
</body>
</html>
